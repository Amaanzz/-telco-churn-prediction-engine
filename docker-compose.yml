version: "3.8"

services:
  # ===== STREAMLIT UI =====
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-prediction-streamlit
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    volumes:
      - .:/app
      - streamlit_cache:/root/.streamlit
    command: streamlit run app.py
    depends_on:
      - fastapi
    networks:
      - churn-network
    restart: unless-stopped

  # ===== FASTAPI BACKEND =====
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-prediction-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - .:/app
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - churn-network
    restart: unless-stopped

  # ===== MLFLOW UI =====
  mlflow:
    image: python:3.11-slim
    container_name: churn-prediction-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install mlflow &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /app/mlruns"
    networks:
      - churn-network
    restart: unless-stopped

volumes:
  streamlit_cache:

networks:
  churn-network:
    driver: bridge